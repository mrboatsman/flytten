apiVersion: apps/v1
kind: Deployment
metadata:
  name: flytten-web
  namespace: flytten
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flytten-web
  template:
    metadata:
      labels:
        app: flytten-web
    spec:
      containers:
        - name: web
          # Byggs av .github/workflows/image.yml – låt Flux image automation
          # eller kustomize images: styra taggen.
          image: ghcr.io/mrboatsman/flytten:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flytten
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flytten-web
  namespace: flytten
spec:
  selector:
    app: flytten-web
  ports:
    - port: 80
      targetPort: 3000
# Ingress utelämnad medvetet – lägg till en som matchar din ingress-klass
# och ditt cert-upplägg, med service flytten-web:80 som backend.
