# Enkel Postgres för flytten. Kör du redan en Postgres-operator (t.ex.
# CloudNativePG) i klustret: ersätt den här filen med en Cluster-resurs och
# peka DATABASE_URL i secreten mot den i stället.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: flytten
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: flytten
            - name: POSTGRES_USER
              value: flytten
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flytten
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ['pg_isready', '-U', 'flytten']
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: flytten
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
